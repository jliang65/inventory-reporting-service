spring:
  application:
    name: inventory-reporting-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/inventory_reporting}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8081