spring:
  application:
    name: inventory-reporting-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/inventory_reporting}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8081

inventory:
  api:
    base-url: ${INVENTORY_API_BASE_URL:http://localhost:8080}
    token: ${INVENTORY_API_TOKEN:}

reports:
  directory: ${REPORTS_DIRECTORY:reports}
