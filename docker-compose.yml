services:
  postgres:
    image: postgres:17
    container_name: inventory-reporting-postgres
    environment:
      POSTGRES_DB: inventory_reporting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - inventory-reporting-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_reporting"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: inventory-reporting-app
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_reporting
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  inventory-reporting-data:
