services:
  postgres:
    image: postgres:17
    container_name: inventory-reporting-postgres
    environment:
      POSTGRES_DB: inventory_reporting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - inventory-reporting-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_reporting"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: inventory-reporting-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - inventory-reporting-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: inventory-reporting-app
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_reporting
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      INVENTORY_API_BASE_URL: ${INVENTORY_API_BASE_URL:-http://host.docker.internal:8080}
      INVENTORY_API_TOKEN: ${INVENTORY_API_TOKEN}
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  inventory-reporting-data:
  inventory-reporting-rabbitmq-data:
